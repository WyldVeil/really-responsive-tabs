// Really Responsive Tabs loader. The first line of a .cfg file is always skipped.
// Registers the really-responsive-tabs/ directory as chrome://really-responsive-tabs/
// and runs main.js from it. Everything interesting lives in that directory.
try {
  const { classes: Cc, interfaces: Ci, utils: Cu, manager: Cm } = Components;
  const dir = Services.dirsvc.get("GreD", Ci.nsIFile);
  dir.append("really-responsive-tabs");

  const manifest = dir.clone();
  manifest.append("chrome.manifest");
  Cm.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);

  // loadSubScript only accepts chrome:, resource: and data: URIs, hence the
  // chrome registration above.
  Services.scriptloader.loadSubScript(
    "chrome://really-responsive-tabs/content/main.js",
    { Services, Components, Cc, Ci, Cu, Cm, installDir: dir },
    "UTF-8"
  );
} catch (e) {
  Components.utils.reportError("really-responsive-tabs: failed to load: " + e);
}
